# Staging LOCAL que imita al VPS: mismo Postgres 16, misma imagen del API, mismos
# límites de memoria. Sirve para ensayar la activación de RLS y las restauraciones de
# backup sin acercarse a producción.
#
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
#
# Puertos distintos a los de desarrollo a propósito (5435 / 3100), para que este stack
# y el `pnpm dev` puedan convivir sin pisarse.
name: ventafacil-staging

services:
  db:
    image: postgres:16-alpine
    container_name: vf-staging-db
    restart: unless-stopped
    # El VPS es 1 vCPU para el stack ENTERO. Fijar ambos contenedores al mismo núcleo
    # es lo que hace que una prueba de carga aquí signifique algo: sin esto, staging
    # mide la máquina de desarrollo (varios núcleos) y las cifras salen 3-4x infladas.
    cpuset: "0"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Mismo tuning que producción (VPS de 1 vCPU / 4 GB), para que staging se comporte
    # como el servidor y no como una máquina de desarrollo holgada.
    command:
      - "postgres"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "wal_compression=on"
    ports:
      - "5435:5432"
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ventafacil-api:staging
    container_name: vf-staging-api
    restart: unless-stopped
    cpuset: "0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # DATABASE_URL apunta al ROL DE APLICACIÓN, no al dueño de las tablas: Postgres
      # ignora RLS para superusuarios y dueños, así que conectarse con ellos dejaría
      # las políticas de adorno. Es justo el error que este staging existe para atrapar.
      DATABASE_URL: postgres://${APP_DB_ROLE}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      # El dueño sólo se usa al arrancar: migrar, sembrar y activar RLS.
      OWNER_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DB_ROLE: ${APP_DB_ROLE}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      ENABLE_RLS: ${ENABLE_RLS:-1}
      API_PORT: 3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Llave propia del panel de plataforma, distinta de la de los negocios. El API no
      # arranca sin ella en producción, ni si es igual a JWT_ACCESS_SECRET.
      JWT_PLATFORM_SECRET: ${JWT_PLATFORM_SECRET}
      DB_POOL_MAX: ${DB_POOL_MAX:-8}
      # ⚠️ RESEND_API_KEY es OBLIGATORIA aquí, aunque el `:-` de abajo diga lo contrario.
      #
      # Este comentario prometía que sin ella los correos se escribían en el log y que
      # `docker logs vf-staging-api` era el buzón de staging. Dejó de ser cierto el 7 de
      # agosto de 2026, cuando el arranque pasó a exigirla en producción — y este stack
      # corre con `NODE_ENV: production` a propósito, para ensayar el VPS. Sin la variable
      # el API NO ARRANCA: muere en `env.ts` antes de escuchar, y lo hace después de migrar
      # y de activar RLS, que es lo que hace que en el log parezca que arrancó bien.
      #
      # Las dos salidas, y ninguna es gratis:
      #   - Clave INVÁLIDA: el stack sube y ensaya production tal cual, pero el mailer llama
      #     a Resend, se lleva un 401 y lo deja en el log. Los correos no salen y el enlace
      #     de verificación no aparece: no se puede completar un registro ni un
      #     restablecimiento de contraseña.
      #   - Bajar `NODE_ENV`: vuelve el buzón en el log, y con él se van las comprobaciones
      #     de arranque que este staging existe para ensayar.
      #
      # Un comentario que describe lo que el código hacía deja de describirlo cuando el
      # código cambia, y el comentario no se entera.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      APP_URL_TEMPLATE: ${APP_URL_TEMPLATE}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      # Topes de peticiones. En staging se suben para poder ejercitar los flujos de
      # punta a punta sin que el limitador corte la prueba; los valores REALES son los
      # de .env.example, y el limitador en sí está cubierto por los tests.
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-20}
      REGISTER_RATE_LIMIT_MAX: ${REGISTER_RATE_LIMIT_MAX:-5}
      EXPORT_RATE_LIMIT_MAX: ${EXPORT_RATE_LIMIT_MAX:-5}
      # Obligatoria en producción: el API no arranca sin ella.
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "3100:3000"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  staging_pgdata:
